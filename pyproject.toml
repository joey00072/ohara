[project]
name = "ohara"
version = "0.1.3"
description = "A collection of implementations of LLMs, papers, and other models."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "joey", email = "00shxf@gmail.com" },
]
dependencies = [
    "datasets>=3.1.0",
    "huggingface-hub>=0.26.0",
    "lightning>=2.3.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.0",
    "safetensors>=0.4.0",
    "tensorboard>=2.18.0",
    "torch>=2.5.0",
    "tqdm>=4.66.0",
    "transformers>=4.46.0",
    "wandb>=0.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/joey00072/ohara"
Repository = "https://github.com/joey00072/ohara"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ohara*"]

[tool.uv]
required-version = ">=0.8.0"
constraint-dependencies = [
    # Keep the shared CUDA 12 environment; newer PyTorch releases may select CUDA 13 wheels.
    "torch==2.10.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
preview = true
select = [
    "E", "F", "W", "B", "C4", "PIE", "NPY", "PLE",
    "B035",
    "DTZ003", "DTZ004",
    "G010",
    "PLW0120", "PLW0129", "PLW0711", "PLW2101",
    "SIM101", "SIM110", "SIM201", "SIM202", "SIM222", "SIM223",
    "S506",
    "RET501", "RET502",
    "RUF006", "RUF008", "RUF013", "RUF016", "RUF017", "RUF200",
    "COM818", "COM819",
    "PYI016", "PYI018", "PYI025",
    "PERF102",
    "UP006", "UP007",
    "FURB148", "FURB163", "FURB181",
    "ASYNC100",
    "TID251",
]
ignore = [
    "B905",
    "E2",
    "E402",
    "E501",
    "E701",
    "E711",
    "E731",
    "E741",
    "B011",
    "C408",
    "NPY002",
    "PIE790",
    "W293",
]
unfixable = [
    "F841",
    "F601",
    "F602",
    "B018",
    "SIM222",
    "SIM223",
    "B006",
]



[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
